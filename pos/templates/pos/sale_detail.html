<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sale {{ sale.pk }}</title>
</head>
<body>
    <h1>Sale {{ sale.pk }}</h1>
    <ul>
    {% for item in sale.items.all %}
        <li>{{ item.product.name }} x{{ item.qty }} @ {{ item.price }} = {{ item.line_total }}</li>
    {% endfor %}
    </ul>
    <p><strong>Total: {{ sale.total }}</strong></p>
    <p><a href="{% url 'sale_new' %}">New sale</a></p>
</body>
</html>
