<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
</head>
<body>
    <h1>Products</h1>
    {% if products %}
        <ul>
        {% for p in products %}
            <li>{{ p.name }} - {{ p.price }}{% if p.category %} ({{ p.category.name }}){% endif %}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Walay produkto pa.</p>
    {% endif %}
</body>
</html>
